[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trademind-ai"
version = "1.31.1"
description = "Explainable market screening and trader analytics platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TradeMind AI" }
]
dependencies = [
  "cryptography>=42",
  "websockets==16.1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.15.21"
]

[project.scripts]
trademind = "trademind.main:main"
trademind-stats = "trademind.stats:main"
trademind-smc-stats = "trademind.smc_stats:main"
trademind-health = "trademind.health:main"
trademind-dashboard = "trademind.dashboard:main"
trademind-validate = "trademind.validation:main"
trademind-candidate-watch = "trademind.candidate_watch:main"
trademind-action-validate = "trademind.action_validation:main"
trademind-paper-gate = "trademind.paper_gate:main"
trademind-volume-collect = "trademind.volume:main"
trademind-fx-research = "trademind.fx_research:main"
trademind-fx-dashboard = "trademind.fx_dashboard:main"
trademind-watchdog = "trademind.watchdog:main"
trademind-watchdog-ote = "trademind.watchdog_ote:main"
trademind-watchdog-unified = "trademind.watchdog_unified:main"
trademind-watchdog-paper = "trademind.watchdog_paper:main"
trademind-smc-ote = "trademind.smc_ote:main"
trademind-unified-center = "trademind.unified_center:main"
trademind-paper-gate-v18 = "trademind.paper_gate_runtime:main"
trademind-bybit = "trademind.bybit_fixed20:main"
trademind-bybit-shadow = "trademind.bybit_shadow:main"
trademind-bybit-shadow-experiments = "trademind.bybit_shadow_experiments:main"
trademind-bybit-shadow-monitor = "trademind.bybit_shadow_monitor:main"
trademind-bybit-risk-plans = "trademind.bybit_risk_plan_experiments:main"
trademind-bybit-risk-backfill = "trademind.bybit_risk_plan_backfill:main"
trademind-bybit-position-management = "trademind.bybit_position_management:main"
trademind-live-signals = "trademind.live_signal_server:main"
trademind-fx-signal-adapter = "trademind.fx_signal_adapter:main"
trademind-crypto-signal-adapter = "trademind.crypto_signal_adapter_v125:main"
trademind-crypto-structure-incremental = "trademind.crypto_structure_incremental:main"
trademind-crypto-opportunities = "trademind.crypto_h1_swing_incremental:main"
trademind-crypto-forward-journal = "trademind.crypto_forward_outcome_journal:main"
trademind-signal-shadow = "trademind.signal_shadow:main"
trademind-signal-evidence = "trademind.signal_evidence:main"
trademind-signal-report = "trademind.signal_research_report:main"
trademind-signal-gate = "trademind.signal_intelligence:main"
trademind-risk-manager = "trademind.risk_manager:main"
trademind-mt5-risk-adapter = "trademind.mt5_risk_adapter:main"
trademind-signal-to-risk = "trademind.signal_to_risk_bridge:main"
trademind-passport-factory = "trademind.signal_passport_factory:main"
trademind-live-runtime = "trademind.live_signal_runtime:main"
trademind-live-dashboard = "trademind.live_signal_dashboard:main"
trademind-product-ui = "trademind.product_ui_v1262:main"
trademind-breakeven-stats = "trademind.breakeven_stat_monitor:main"
trademind-breakeven-counterfactual = "trademind.breakeven_counterfactual:main"
trademind-breakeven-runtime = "trademind.breakeven_runtime:main"
trademind-breakeven-report = "trademind.breakeven_decision_report:main"
trademind-orchestrator-mock = "trademind.orchestrator.mock_runner:main"
trademind-mt5-prospective-monitor = "trademind.mt5_prospective_monitor:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["trademind", "trademind.market", "trademind.signals", "trademind.structure", "trademind.orchestrator", "trademind.discovery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/trademind/paper_gate_v18.py" = ["F401"]
"src/trademind/bybit_shadow_experiments.py" = ["F401"]
"src/trademind/bybit_shadow_monitor.py" = ["F401"]
"src/trademind/bybit_risk_plan_experiments.py" = ["F401"]
"src/trademind/bybit_risk_plan_backfill.py" = ["F401"]
"src/trademind/bybit_position_management.py" = ["F401"]
"src/trademind/risk_manager.py" = ["F401"]
