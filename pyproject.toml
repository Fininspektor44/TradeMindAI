[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trademind-ai"
version = "0.8.0"
description = "Explainable market screening and trader analytics platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TradeMind AI" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
trademind = "trademind.main:main"
trademind-stats = "trademind.stats:main"
trademind-smc-stats = "trademind.smc_stats:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["trademind", "trademind.market", "trademind.signals", "trademind.structure"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
