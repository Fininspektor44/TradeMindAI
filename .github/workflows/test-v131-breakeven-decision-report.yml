name: Test v1.31 BreakEven Decision Report

on:
  push:
    branches:
      - feature/v1.31-breakeven-decision-report
  pull_request:
    paths:
      - "src/trademind/breakeven_decision_report.py"
      - "src/trademind/breakeven_runtime.py"
      - "tests/test_breakeven_decision_report.py"
      - "tests/test_breakeven_runtime.py"
      - "scripts/run_v130_breakeven_runtime.ps1"
      - "pyproject.toml"
      - ".github/workflows/test-v131-breakeven-decision-report.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install pytest ruff==0.15.21
      - name: Ruff
        run: |
          python -m ruff check \
            src/trademind/breakeven_decision_report.py \
            src/trademind/breakeven_runtime.py \
            tests/test_breakeven_decision_report.py \
            tests/test_breakeven_runtime.py
      - name: BreakEven regression tests
        run: |
          python -m pytest -q \
            tests/test_breakeven_stat_monitor.py \
            tests/test_breakeven_counterfactual.py \
            tests/test_breakeven_decision_report.py \
            tests/test_breakeven_runtime.py
      - name: Read-only boundary
        shell: bash
        run: |
          files="src/trademind/breakeven_decision_report.py src/trademind/breakeven_runtime.py scripts/run_v130_breakeven_runtime.ps1"
          if grep -Ei 'OrderSend|OrderSendAsync|PositionModify|PositionClose|MetaTrader5' $files; then
            echo "Forbidden execution token found"
            exit 1
          fi
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/run_v130_breakeven_runtime.ps1",
            [ref]$null,
            [ref]$errors
          )
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
