name: Test TradeMind v1.15 watchdog

on:
  push:
    branches:
      - feature/v1.15-grid-basket-analytics
  pull_request:
    paths:
      - "src/trademind/control_center_watchdog.py"
      - "tests/test_control_center_watchdog.py"
      - "scripts/run_v115_control_center_watch.ps1"
      - "scripts/install_v115_control_center_watch.ps1"
      - ".github/workflows/test-v115-watchdog.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_control_center_watchdog.py tests/test_robot_control_center.py tests/test_grid_snapshot_drawdown.py
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          foreach ($file in @(
            "scripts/run_v115_control_center_watch.ps1",
            "scripts/install_v115_control_center_watch.ps1"
          )) {
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            )
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
