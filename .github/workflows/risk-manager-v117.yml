name: Test TradeMind v1.17 risk manager

on:
  push:
    branches:
      - feature/v1.17-risk-manager-core
    paths:
      - "src/trademind/risk_manager.py"
      - "tests/test_risk_manager.py"
      - "scripts/run_v117_risk_manager.ps1"
      - "pyproject.toml"
      - ".github/workflows/risk-manager-v117.yml"
  pull_request:
    paths:
      - "src/trademind/risk_manager.py"
      - "tests/test_risk_manager.py"
      - "scripts/run_v117_risk_manager.ps1"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/trademind/risk_manager.py tests/test_risk_manager.py
      - name: Tests
        run: pytest -q tests/test_risk_manager.py tests/test_signal_intelligence.py
      - name: Parse PowerShell runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/run_v117_risk_manager.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
