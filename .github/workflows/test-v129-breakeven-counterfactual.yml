name: Test v1.29 BreakEven Counterfactual

on:
  push:
    branches:
      - feature/v1.29-breakeven-counterfactual
  pull_request:
    paths:
      - "src/trademind/breakeven_counterfactual.py"
      - "tests/test_breakeven_counterfactual.py"
      - "scripts/run_v129_breakeven_counterfactual.ps1"
      - "pyproject.toml"
      - ".github/workflows/test-v129-breakeven-counterfactual.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install pytest ruff==0.15.21
      - name: Ruff
        run: python -m ruff check src/trademind/breakeven_counterfactual.py tests/test_breakeven_counterfactual.py
      - name: v1.29 tests
        run: python -m pytest -q tests/test_breakeven_counterfactual.py
      - name: v1.28 regression
        run: python -m pytest -q tests/test_breakeven_stat_monitor.py
      - name: Read-only boundary
        shell: bash
        run: |
          if grep -Ei 'OrderSend|OrderSendAsync|PositionModify|PositionClose|MetaTrader5' src/trademind/breakeven_counterfactual.py; then
            echo "Forbidden execution token found"
            exit 1
          fi
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/run_v129_breakeven_counterfactual.ps1",[ref]$null,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_ }; exit 1}
