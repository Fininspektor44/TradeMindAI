name: Test TradeMind v1.19 Signal-to-Risk Bridge

on:
  push:
    branches:
      - feature/v1.19-signal-to-risk-bridge
    paths:
      - "src/trademind/signal_to_risk_bridge.py"
      - "tests/test_signal_to_risk_bridge.py"
      - "scripts/run_v119_signal_to_risk_bridge.ps1"
      - "pyproject.toml"
      - ".github/workflows/signal-to-risk-bridge-v119.yml"
  pull_request:
    paths:
      - "src/trademind/signal_to_risk_bridge.py"
      - "tests/test_signal_to_risk_bridge.py"
      - "scripts/run_v119_signal_to_risk_bridge.ps1"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/trademind/signal_to_risk_bridge.py tests/test_signal_to_risk_bridge.py
      - name: Tests
        run: pytest -q tests/test_signal_to_risk_bridge.py tests/test_mt5_risk_adapter.py tests/test_risk_manager.py tests/test_signal_intelligence.py
      - name: Parse PowerShell runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/run_v119_signal_to_risk_bridge.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify read-only boundary
        shell: pwsh
        run: |
          $source = Get-Content "src/trademind/signal_to_risk_bridge.py" -Raw
          $forbidden = @(
            "OrderSend(",
            "OrderSendAsync(",
            "PositionClose(",
            "PositionModify(",
            "import MetaTrader5",
            "import requests"
          )
          foreach ($token in $forbidden) {
            if ($source.Contains($token)) {
              throw "Forbidden execution or broker-client token found: $token"
            }
          }
