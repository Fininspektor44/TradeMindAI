name: Test AOExtremum v1.30.1 BreakEven Patch

on:
  push:
    branches:
      - feature/aoextremum-v130-breakeven
  pull_request:
    paths:
      - "mt5/experts/AOExtremum_Original11_AllPairs_EXACT_v1_30_PROP_RISK.mq5"
      - "scripts/patch_aoextremum_v130_breakeven.py"
      - "tests/test_aoextremum_v130_breakeven_patch.py"
      - ".github/workflows/test-aoextremum-v130-breakeven.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test break-even patch invariants
        run: python -m pytest -q tests/test_aoextremum_v130_breakeven_patch.py
      - name: Python syntax check
        run: python -m py_compile scripts/patch_aoextremum_v130_breakeven.py
