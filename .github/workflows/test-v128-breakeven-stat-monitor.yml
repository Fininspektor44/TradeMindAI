name: Test v1.28 BreakEven Statistics Monitor

on:
  push:
    branches:
      - feature/v1.28-breakeven-stat-monitor
  pull_request:
    paths:
      - "src/trademind/breakeven_stat_monitor.py"
      - "tests/test_breakeven_stat_monitor.py"
      - "scripts/run_v128_breakeven_stat_monitor.ps1"
      - "pyproject.toml"
      - ".github/workflows/test-v128-breakeven-stat-monitor.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install pytest ruff==0.15.21
      - name: Ruff
        run: python -m ruff check src/trademind/breakeven_stat_monitor.py tests/test_breakeven_stat_monitor.py
      - name: Tests
        run: python -m pytest -q tests/test_breakeven_stat_monitor.py
      - name: Read-only boundary
        shell: bash
        run: |
          if grep -Ei 'OrderSend|OrderSendAsync|PositionModify|PositionClose|MetaTrader5' src/trademind/breakeven_stat_monitor.py; then
            echo "Forbidden execution token found"
            exit 1
          fi
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/run_v128_breakeven_stat_monitor.ps1",[ref]$null,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_ }; exit 1}
