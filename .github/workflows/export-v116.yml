name: Export AOExtremum v1.16

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload v1.16 package
        uses: actions/upload-artifact@v4
        with:
          name: AOExtremum_Portfolio4_v1_16_manual
          path: |
            mt5/AOExtremum_Portfolio4_v1_16_manual.mq5
            mt5/AOExtremum_Portfolio4_v1_14.mq5
          if-no-files-found: error
          retention-days: 7
