name: Test TradeMind v1.16 signal intelligence

on:
  push:
    branches:
      - feature/v1.16-signal-intelligence-core
    paths:
      - "src/trademind/signal_intelligence.py"
      - "src/trademind/signal_evidence.py"
      - "src/trademind/fx_signal_adapter.py"
      - "src/trademind/signal_shadow.py"
      - "tests/test_signal_intelligence.py"
      - "tests/test_signal_evidence.py"
      - "tests/test_fx_signal_adapter.py"
      - "tests/test_signal_shadow.py"
      - "pyproject.toml"
      - ".github/workflows/signal-intelligence-v116.yml"
  pull_request:
    paths:
      - "src/trademind/signal_intelligence.py"
      - "src/trademind/signal_evidence.py"
      - "src/trademind/fx_signal_adapter.py"
      - "src/trademind/signal_shadow.py"
      - "tests/test_signal_intelligence.py"
      - "tests/test_signal_evidence.py"
      - "tests/test_fx_signal_adapter.py"
      - "tests/test_signal_shadow.py"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: >-
          ruff check
          src/trademind/signal_intelligence.py
          src/trademind/signal_evidence.py
          src/trademind/fx_signal_adapter.py
          src/trademind/signal_shadow.py
          tests/test_signal_intelligence.py
          tests/test_signal_evidence.py
          tests/test_fx_signal_adapter.py
          tests/test_signal_shadow.py
      - name: Tests
        run: >-
          pytest -q
          tests/test_signal_intelligence.py
          tests/test_signal_evidence.py
          tests/test_fx_signal_adapter.py
          tests/test_signal_shadow.py
