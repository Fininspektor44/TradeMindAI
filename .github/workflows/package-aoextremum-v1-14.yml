name: Package AOExtremum v1.14

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload MQ5 source
        uses: actions/upload-artifact@v4
        with:
          name: AOExtremum_Portfolio4_v1_14
          path: mt5/AOExtremum_Portfolio4_v1_14.mq5
          if-no-files-found: error
          retention-days: 1
