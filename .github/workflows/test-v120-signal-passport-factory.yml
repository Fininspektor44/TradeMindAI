name: Test TradeMind v1.20 Signal Passport Factory

on:
  push:
    branches:
      - feature/v1.20-signal-passport-factory
  pull_request:
    paths:
      - "src/trademind/signal_passport_factory.py"
      - "src/trademind/signal_to_risk_bridge.py"
      - "scripts/run_v120_signal_passport_factory.ps1"
      - "scripts/run_v120_signal_pipeline.ps1"
      - "tests/test_signal_passport_factory.py"
      - "tests/test_signal_to_risk_bridge.py"
      - "tests/test_mt5_risk_adapter.py"
      - "tests/test_risk_manager.py"
      - "tests/test_signal_intelligence.py"
      - "pyproject.toml"
      - ".github/workflows/test-v120-signal-passport-factory.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/trademind/signal_passport_factory.py tests/test_signal_passport_factory.py
      - name: Tests
        run: >-
          pytest -q
          tests/test_signal_passport_factory.py
          tests/test_signal_to_risk_bridge.py
          tests/test_mt5_risk_adapter.py
          tests/test_risk_manager.py
          tests/test_signal_intelligence.py
      - name: Parse PowerShell runners
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/run_v120_signal_passport_factory.ps1",
            "scripts/run_v120_signal_pipeline.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }
      - name: Verify read-only boundary
        shell: pwsh
        run: |
          $source = Get-Content "src/trademind/signal_passport_factory.py" -Raw
          $forbidden = @(
            "OrderSend(",
            "OrderSendAsync(",
            "PositionClose(",
            "PositionModify(",
            "import MetaTrader5",
            "import requests"
          )
          foreach ($token in $forbidden) {
            if ($source.Contains($token)) {
              throw "Forbidden execution or broker-client token found: $token"
            }
          }
