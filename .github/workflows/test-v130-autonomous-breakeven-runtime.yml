name: Test v1.30 Autonomous BreakEven Runtime

on:
  push:
    branches:
      - feature/v1.30-autonomous-breakeven-runtime
  pull_request:
    paths:
      - "src/trademind/breakeven_runtime.py"
      - "tests/test_breakeven_runtime.py"
      - "scripts/run_v130_breakeven_runtime.ps1"
      - "scripts/install_v130_breakeven_runtime_task.ps1"
      - "pyproject.toml"
      - ".github/workflows/test-v130-autonomous-breakeven-runtime.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install pytest ruff==0.15.21
      - name: Ruff
        run: |
          python -m ruff check \
            src/trademind/breakeven_runtime.py \
            tests/test_breakeven_runtime.py
      - name: BreakEven regression tests
        run: |
          python -m pytest -q \
            tests/test_breakeven_stat_monitor.py \
            tests/test_breakeven_counterfactual.py \
            tests/test_breakeven_runtime.py
      - name: Read-only boundary
        shell: bash
        run: |
          files="src/trademind/breakeven_runtime.py scripts/run_v130_breakeven_runtime.ps1 scripts/install_v130_breakeven_runtime_task.ps1"
          if grep -Ei 'OrderSend|OrderSendAsync|PositionModify|PositionClose|MetaTrader5' $files; then
            echo "Forbidden execution token found"
            exit 1
          fi
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/run_v130_breakeven_runtime.ps1",
            "scripts/install_v130_breakeven_runtime_task.ps1"
          )
          foreach($file in $files) {
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$null,
              [ref]$errors
            )
            if($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
